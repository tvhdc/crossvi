<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrossVi Sleep Image Maker</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f3e8;
      --paper-strong: #fffaf0;
      --ink: #17212b;
      --muted: #65717c;
      --line: #d9d0be;
      --green: #2f8c68;
      --green-dark: #176246;
      --amber: #b7791f;
      --blue: #315f9d;
      --shadow: 0 18px 60px rgba(49, 35, 12, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 12%, rgba(47, 140, 104, 0.17), transparent 30%),
        radial-gradient(circle at 90% 8%, rgba(183, 121, 31, 0.14), transparent 34%),
        linear-gradient(135deg, #efe7d6, #f9f5ea 54%, #e9dfcc);
    }

    main {
      display: grid;
      grid-template-columns: minmax(290px, 430px) minmax(280px, 1fr);
      gap: 26px;
      width: min(1160px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .panel, .previewPanel {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 250, 240, 0.9);
      box-shadow: var(--shadow);
    }

    .panel { padding: 20px; }

    .topbar {
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.06;
      letter-spacing: -0.045em;
    }

    p { margin: 0 0 16px; color: var(--muted); }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--green-dark);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 750;
    }

    input[type="file"], select, input[type="range"] { width: 100%; }

    select, .download {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px 12px;
      color: var(--ink);
      background: #fffdf7;
      font: inherit;
    }

    input[type="file"] {
      padding: 11px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: #fffdf7;
    }

    .language {
      min-width: 128px;
      width: min(210px, 100%);
      margin-left: auto;
      margin-top: 0;
    }

    .inline {
      display: grid;
      gap: 12px;
    }

    .advanced {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid rgba(47, 140, 104, 0.22);
      border-radius: 18px;
      background: rgba(47, 140, 104, 0.07);
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 12px;
      color: var(--ink);
      font-weight: 650;
    }

    .option input { width: 18px; height: 18px; margin-top: 3px; }

    .hint, output {
      color: var(--muted);
      font-size: 14px;
    }

    .download {
      display: inline-block;
      margin-top: 18px;
      width: 100%;
      text-align: center;
      text-decoration: none;
      font-weight: 850;
      background: var(--green);
      color: white;
      border: 0;
    }

    .download[aria-disabled="true"] {
      pointer-events: none;
      opacity: 0.55;
      background: #87928d;
    }

    .previewPanel {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: calc(100vh - 48px);
      overflow: hidden;
    }

    .previewHeader, .previewFooter {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .previewFooter {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 850;
      background: #eef1f4;
      color: #42505c;
      white-space: nowrap;
    }

    .badge.transparent {
      background: rgba(49, 95, 157, 0.13);
      color: var(--blue);
    }

    .badge.solid {
      background: rgba(47, 140, 104, 0.13);
      color: var(--green-dark);
    }

    .badge.bmp {
      background: rgba(183, 121, 31, 0.16);
      color: #875315;
    }

    .previewStage {
      display: grid;
      place-items: center;
      padding: 20px;
      overflow: auto;
      background: #d9d0be;
    }

    .checker {
      padding: 18px;
      border-radius: 20px;
      background-color: #f8fafc;
      background-image:
        linear-gradient(45deg, #aab2bd 25%, transparent 25%),
        linear-gradient(-45deg, #aab2bd 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #aab2bd 75%),
        linear-gradient(-45deg, transparent 75%, #aab2bd 75%);
      background-size: 28px 28px;
      background-position: 0 0, 0 14px, 14px -14px, -14px 0;
      box-shadow: inset 0 0 0 1px rgba(23, 33, 43, 0.18);
    }

    canvas {
      display: block;
      width: min(100%, 528px);
      height: auto;
      max-height: calc(100vh - 190px);
      object-fit: contain;
      background: transparent;
      box-shadow: 0 0 0 1px rgba(23, 33, 43, 0.28);
    }

    .hidden { display: none; }

    @media (max-width: 840px) {
      main { grid-template-columns: 1fr; padding: 14px; }
      .language { width: 100%; }
      .previewPanel { min-height: auto; }
      .previewHeader, .previewFooter { align-items: flex-start; flex-direction: column; }
      canvas { max-height: 70vh; }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <div class="topbar">
        <div>
          <p class="eyebrow" data-i18n="eyebrow"></p>
          <h1 data-i18n="title"></h1>
        </div>
        <label class="language">
          <span data-i18n="language"></span>
          <select id="language">
            <option value="vi">Tiếng Việt</option>
            <option value="en">English</option>
            <option value="zh">简体中文</option>
          </select>
        </label>
      </div>

      <p data-i18n="intro"></p>

      <label for="file" data-i18n="fileLabel"></label>
      <input id="file" type="file" accept="image/*">
      <p class="hint" data-i18n="fileHint"></p>

      <div class="inline">
        <div>
          <label for="device" data-i18n="deviceLabel"></label>
          <select id="device">
            <option value="x3" selected data-i18n="deviceX3"></option>
            <option value="x4" data-i18n="deviceX4"></option>
          </select>
        </div>
        <div>
          <label for="mode" data-i18n="modeLabel"></label>
          <select id="mode">
            <option value="transparent" selected data-i18n="modeTransparent"></option>
            <option value="normal" data-i18n="modeNormal"></option>
          </select>
        </div>
      </div>

      <section id="transparentOptions" class="advanced">
        <strong data-i18n="cleanTitle"></strong>
        <p class="hint" data-i18n="cleanHint"></p>

        <label class="option">
          <input id="removeWhite" type="checkbox">
          <span data-i18n="removeWhite"></span>
        </label>

        <label for="threshold">
          <span data-i18n="whiteAmount"></span>
          <output id="thresholdOut">245</output>
        </label>
        <input id="threshold" type="range" min="200" max="255" value="245">
        <p class="hint" data-i18n="whiteAmountHint"></p>

        <label class="option">
          <input id="edgeOnly" type="checkbox" checked>
          <span data-i18n="edgeOnly"></span>
        </label>
      </section>

      <section id="normalOptions" class="advanced hidden">
        <strong data-i18n="smoothTitle"></strong>
        <p class="hint" data-i18n="smoothHint"></p>
        <label class="option">
          <input id="dither" type="checkbox" checked>
          <span data-i18n="dither"></span>
        </label>
      </section>

      <a id="download" class="download" aria-disabled="true" download="sleep-overlay.png"></a>

      <p class="hint" id="status"></p>
      <p class="hint" data-i18n="copyHint"></p>
    </section>

    <section class="previewPanel">
      <div class="previewHeader">
        <div>
          <strong data-i18n="previewTitle"></strong>
          <p class="hint" id="previewHint"></p>
        </div>
        <span id="previewBadge" class="badge"></span>
      </div>
      <div class="previewStage">
        <div class="checker">
          <canvas id="canvas" width="528" height="792"></canvas>
        </div>
      </div>
      <div class="previewFooter">
        <span id="stats"></span>
        <span data-i18n="checkerHint"></span>
      </div>
    </section>
  </main>

        whiteAmount: "白底去除强度：",

        downloadWorking: "正在准备文件…",
        downloadReady: "下载 {name}（{size}）",
        statusLoaded: "原图：{width}×{height}，{size}",
        statusError: "无法打开这张图片。请尝试 PNG、JPG、BMP 或 WebP。",
        copyHint: "把下载的文件复制到 SD 卡根目录。叠加图片用 /sleep-overlay.png；普通睡眠图用 /sleep.bmp。",
        previewTitle: "预览",
        previewEmpty: "选择图片后会在这里预览结果。",
        previewTransparent: "棋盘格表示不会遮住下面画面的区域。",
        previewNormal: "BMP 会覆盖整个屏幕，没有透明区域。",
        badgeEmpty: "还没有图片",
        badgeTransparent: "有透明区域 · {percent}%",
        badgeSolid: "没有透明区域",
        badgeBmp: "BMP · 不支持透明",
        stats: "{device} · {width}×{height} · {mode}",
        statsTransparent: "透明叠加 PNG",
        statsNormal: "睡眠 BMP",
        checkerHint: "棋盘格只用于显示透明区域，不会保存到文件中。"
      }
    };

    const LANGUAGE_KEY = "crossvi.sleepConverter.language";
    const targets = {
      x3: { width: 528, height: 792 },
      x4: { width: 480, height: 800 }
    };
    const bayer = [
      [0, 8, 2, 10],
      [12, 4, 14, 6],
      [3, 11, 1, 9],
      [15, 7, 13, 5]
    ];
    const els = {
      file: document.getElementById("file"),
      language: document.getElementById("language"),
      device: document.getElementById("device"),
      mode: document.getElementById("mode"),
      threshold: document.getElementById("threshold"),
      thresholdOut: document.getElementById("thresholdOut"),
      removeWhite: document.getElementById("removeWhite"),
      edgeOnly: document.getElementById("edgeOnly"),
      dither: document.getElementById("dither"),
      transparentOptions: document.getElementById("transparentOptions"),
      normalOptions: document.getElementById("normalOptions"),
      download: document.getElementById("download"),
      status: document.getElementById("status"),
      stats: document.getElementById("stats"),
      previewHint: document.getElementById("previewHint"),
      previewBadge: document.getElementById("previewBadge"),
      canvas: document.getElementById("canvas")
    };
    const ctx = els.canvas.getContext("2d", { willReadFrequently: true });
    let sourceImage = null;
    let sourceInfo = null;
    let sourceError = false;
    let downloadUrl = null;
    let language = initialLanguage();

    function initialLanguage() {
      const saved = localStorage.getItem(LANGUAGE_KEY);
      if (saved && TEXT[saved]) return saved;
      const browserLanguages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
      for (const item of browserLanguages) {
        const low = item.toLowerCase();
        if (low.startsWith("vi")) return "vi";
        if (low.startsWith("zh")) return "zh";
      }
      return "en";
    }

    function t(key, values = {}) {
      let text = (TEXT[language] && TEXT[language][key]) || TEXT.en[key] || key;
      for (const [name, value] of Object.entries(values)) {
        text = text.replaceAll(`{${name}}`, value);
      }
      return text;
    }

    function applyLanguage() {
      document.documentElement.lang = language === "zh" ? "zh-Hans" : language;
      document.title = t("title");
      els.language.value = language;
      document.querySelectorAll("[data-i18n]").forEach(node => {
        node.textContent = t(node.dataset.i18n);
      });
      refreshStatus();
      render();
    }

    function formatSize(bytes) {
      if (!bytes) return "0 KB";
      if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function setStatus(text) {
      els.status.textContent = text || "";
    }

    function whiteLevelLabel(value) {
      if (value >= 250) return t("whiteLevelVeryStrong");
      if (value >= 240) return t("whiteLevelStrong");
      if (value >= 220) return t("whiteLevelNormal");
      return t("whiteLevelGentle");
    }

    function refreshStatus() {
      if (sourceError) {
        setStatus(t("statusError"));
      } else if (sourceInfo) {
        setStatus(t("statusLoaded", sourceInfo));
      } else {
        setStatus("");
      }
    }

    function revokeDownload() {
      if (downloadUrl) URL.revokeObjectURL(downloadUrl);
      downloadUrl = null;
      els.download.href = "";
      els.download.setAttribute("aria-disabled", "true");
    }

    function target() {
      return targets[els.device.value] || targets.x3;
    }

    function transparencyStats(imageData) {
      const data = imageData.data;
      let transparent = 0;
      for (let i = 3; i < data.length; i += 4) {
        if (data[i] < 250) transparent++;
      }
      const total = data.length / 4;
      return { has: transparent > 0, percent: Math.round((transparent * 1000) / total) / 10 };
    }

    function hasTransparency(imageData) {
      return transparencyStats(imageData).has;
    }

    function nearWhite(data, i, threshold) {
      return data[i + 3] > 0 && data[i] >= threshold && data[i + 1] >= threshold && data[i + 2] >= threshold;
    }

    function alphaBox(data, width, height) {
      let left = width, right = -1, top = height, bottom = -1;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          if (data[(y * width + x) * 4 + 3] > 4) {
            if (x < left) left = x;
            if (x > right) right = x;
            if (y < top) top = y;
            if (y > bottom) bottom = y;
          }
        }
      }
      return right < left ? null : { left, right, top, bottom };
    }

    function removeWhiteBackground(imageData, threshold, edgeOnly) {
      const { width, height, data } = imageData;
      if (!edgeOnly) {
        for (let i = 0; i < data.length; i += 4) {
          if (nearWhite(data, i, threshold)) data[i + 3] = 0;
        }
        return;
      }

      const box = alphaBox(data, width, height);
      if (!box) return;
      const seen = new Uint8Array(width * height);
      const queue = [];
      const push = (x, y) => {
        if (x < box.left || x > box.right || y < box.top || y > box.bottom) return;
        const p = y * width + x;
        if (seen[p]) return;
        const i = p * 4;
        if (!nearWhite(data, i, threshold)) return;
        seen[p] = 1;
        queue.push(p);
      };
      for (let x = box.left; x <= box.right; x++) {
        push(x, box.top);
        push(x, box.bottom);
      }
      for (let y = box.top; y <= box.bottom; y++) {
        push(box.left, y);
        push(box.right, y);
      }
      for (let qi = 0; qi < queue.length; qi++) {
        const p = queue[qi];
        data[p * 4 + 3] = 0;
        const x = p % width;
        const y = Math.floor(p / width);
        push(x + 1, y);
        push(x - 1, y);
        push(x, y + 1);
        push(x, y - 1);
      }
    }

    function ditherCanvasToBlackWhite(canvas) {
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
          const i = (y * canvas.width + x) * 4;
          const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
          const threshold = els.dither.checked ? (bayer[y & 3][x & 3] + 0.5) * 16 : 145;
          const v = gray < threshold ? 0 : 255;
          data[i] = data[i + 1] = data[i + 2] = v;
          data[i + 3] = 255;
        }
      }
      ctx.putImageData(imageData, 0, 0);
    }

    function drawSource() {
      const t = target();
      els.canvas.width = t.width;
      els.canvas.height = t.height;
      ctx.clearRect(0, 0, t.width, t.height);
      if (els.mode.value === "normal") {
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, t.width, t.height);
      }
      if (!sourceImage) return null;

      const scale = Math.min(t.width / sourceImage.naturalWidth, t.height / sourceImage.naturalHeight, 1);
      const drawWidth = Math.max(1, Math.round(sourceImage.naturalWidth * scale));
      const drawHeight = Math.max(1, Math.round(sourceImage.naturalHeight * scale));
      const x = Math.floor((t.width - drawWidth) / 2);
      const y = Math.floor((t.height - drawHeight) / 2);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(sourceImage, x, y, drawWidth, drawHeight);
      const sourceRect = { x, y, width: drawWidth, height: drawHeight };

      if (els.mode.value === "transparent" && els.removeWhite.checked) {
        const imageData = ctx.getImageData(0, 0, t.width, t.height);
        removeWhiteBackground(imageData, Number(els.threshold.value), els.edgeOnly.checked);
        ctx.putImageData(imageData, 0, 0);
      }
      if (els.mode.value === "normal") ditherCanvasToBlackWhite(els.canvas);
      return sourceRect;
    }

    function makeBmpBlob(canvas) {
      const width = canvas.width;
      const height = canvas.height;
      const rowStride = Math.ceil(width / 32) * 4;
      const pixelBytes = rowStride * height;
      const fileSize = 14 + 40 + 8 + pixelBytes;
      const bytes = new Uint8Array(fileSize);
      const view = new DataView(bytes.buffer);
      bytes[0] = 0x42; bytes[1] = 0x4d;
      view.setUint32(2, fileSize, true);
      view.setUint32(10, 14 + 40 + 8, true);
      view.setUint32(14, 40, true);
      view.setInt32(18, width, true);
      view.setInt32(22, height, true);
      view.setUint16(26, 1, true);
      view.setUint16(28, 1, true);
      view.setUint32(34, pixelBytes, true);
      view.setUint32(46, 2, true);
      view.setUint32(50, 2, true);
      bytes.set([0, 0, 0, 0, 255, 255, 255, 0], 54);

      const imageData = ctx.getImageData(0, 0, width, height).data;
      const offset = 14 + 40 + 8;
      for (let y = 0; y < height; y++) {
        const srcY = height - 1 - y;
        const row = offset + y * rowStride;
        for (let x = 0; x < width; x++) {
          const i = (srcY * width + x) * 4;
          const gray = imageData[i] * 0.299 + imageData[i + 1] * 0.587 + imageData[i + 2] * 0.114;
          if (gray >= 128) bytes[row + (x >> 3)] |= 0x80 >> (x & 7);
        }
      }
      return new Blob([bytes], { type: "image/bmp" });
    }

    function updatePreviewState() {
      const profile = target();
      const modeText = els.mode.value === "transparent" ? t("statsTransparent") : t("statsNormal");
      els.stats.textContent = t("stats", {
        device: els.device.value.toUpperCase(),
        width: profile.width,
        height: profile.height,
        mode: modeText
      });

      els.previewBadge.className = "badge";
      if (!sourceImage) {
        els.previewHint.textContent = t("previewEmpty");
        els.previewBadge.textContent = t("badgeEmpty");
        return;
      }
      if (els.mode.value === "normal") {
        els.previewHint.textContent = t("previewNormal");
        els.previewBadge.classList.add("bmp");
        els.previewBadge.textContent = t("badgeBmp");
        return;
      }

      const stats = transparencyStats(ctx.getImageData(0, 0, els.canvas.width, els.canvas.height));
      els.previewHint.textContent = t("previewTransparent");
      if (stats.has) {
        els.previewBadge.classList.add("transparent");
        els.previewBadge.textContent = t("badgeTransparent", { percent: stats.percent });
      } else {
        els.previewBadge.classList.add("solid");
        els.previewBadge.textContent = t("badgeSolid");
      }
    }

    function updateDownload() {
      revokeDownload();
      if (!sourceImage) {
        els.download.textContent = t("downloadIdle");
        return;
      }
      const name = els.mode.value === "transparent" ? "sleep-overlay.png" : "sleep.bmp";
      els.download.textContent = t("downloadWorking");
      const finish = (blob) => {
        downloadUrl = URL.createObjectURL(blob);
        els.download.href = downloadUrl;
        els.download.download = name;
        els.download.removeAttribute("aria-disabled");
        els.download.textContent = t("downloadReady", { name, size: formatSize(blob.size) });
      };
      if (els.mode.value === "transparent") {
        els.canvas.toBlob(finish, "image/png");
      } else {
        finish(makeBmpBlob(els.canvas));
      }
    }

    function render() {
      els.transparentOptions.classList.toggle("hidden", els.mode.value !== "transparent");
      els.normalOptions.classList.toggle("hidden", els.mode.value !== "normal");
      els.thresholdOut.textContent = whiteLevelLabel(Number(els.threshold.value));
      drawSource();
      updatePreviewState();
      updateDownload();
    }

    els.language.addEventListener("change", () => {
      language = els.language.value;
      localStorage.setItem(LANGUAGE_KEY, language);
      applyLanguage();
    });

    els.file.addEventListener("change", () => {
      const file = els.file.files && els.file.files[0];
      revokeDownload();
      sourceImage = null;
      sourceInfo = null;
      sourceError = false;
      if (!file) {
        render();
        refreshStatus();
        return;
      }
      const img = new Image();
      img.onload = () => {
        sourceImage = img;
        const sourceRect = drawSource();
        const imageData = ctx.getImageData(sourceRect.x, sourceRect.y, sourceRect.width, sourceRect.height);
        els.removeWhite.checked = els.mode.value === "transparent" && !hasTransparency(imageData);
        sourceInfo = {
          width: img.naturalWidth,
          height: img.naturalHeight,
          size: formatSize(file.size)
        };
        sourceError = false;
        refreshStatus();
        render();
        URL.revokeObjectURL(img.src);
      };
      img.onerror = () => {
        sourceInfo = null;
        sourceError = true;
        refreshStatus();
        render();
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(file);
    });

    for (const el of [els.device, els.mode, els.threshold, els.removeWhite, els.edgeOnly, els.dither]) {
      el.addEventListener("input", render);
      el.addEventListener("change", render);
    }
    applyLanguage();
  </script>
</body>
</html>
