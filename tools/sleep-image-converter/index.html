<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrossVi Sleep Image Maker</title>
  <style>
    :root {
      --font-color: #333;
      --bg: #f5f5f5;
      --title-color: #2c3e50;
      --card-bg: #fff;
      --label-color: #7f8c8d;
      --border-color: #e5e8eb;
      --accent-color: rgb(110, 154, 130);
      --accent-color-10: rgba(110, 154, 130, 0.1);
      --accent-hover-color: #5a8c73;
      --blue: #315f9d;
      --warning: #b7791f;
      --badge-bg: #eef1f4;
      --badge-text: #42505c;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --font-color: #f5f5f5;
        --bg: #333;
        --title-color: #ecf0f1;
        --card-bg: #444;
        --label-color: #bdc3c7;
        --border-color: #555;
        --accent-color-10: rgba(110, 154, 130, 0.16);
        --accent-hover-color: #9bc8ae;
        --blue: #a9c7ff;
        --warning: #f1c06a;
        --badge-bg: #3a4147;
        --badge-text: #dce4ec;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }

    body {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px;
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      color: var(--font-color);
      background: var(--bg);
    }

    main {
      width: 100%;
    }

    .site-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    .site-header h1 {
      margin: 0;
      color: var(--title-color);
      font-size: clamp(30px, 4vw, 44px);
      line-height: 1.06;
      letter-spacing: -0.035em;
    }

    .lead {
      max-width: 670px;
      margin: 8px 0 0;
      color: var(--label-color);
    }

    .flow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      color: var(--label-color);
      font-size: 14px;
    }

    .flow span {
      padding: 5px 9px;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      background: var(--card-bg);
    }

    .flow .arrow {
      border: 0;
      padding-inline: 0;
      background: transparent;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(310px, 390px) minmax(360px, 1fr);
      gap: 18px;
    }

    .panel, .previewPanel {
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
    }

    .panel { padding: 20px; align-self: start; }

    p { margin: 0 0 14px; color: var(--label-color); }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent-color);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      color: var(--title-color);
      font-weight: 700;
    }

    input[type="file"], select, input[type="range"] { width: 100%; }

    select, .download {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--font-color);
      background: var(--card-bg);
      font: inherit;
    }

    select option {
      color: #1f2937;
      background: #fff;
    }

    input[type="file"] {
      padding: 10px;
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      background: var(--bg);
      color: var(--font-color);
    }

    input[type="file"]::file-selector-button {
      margin-right: 10px;
      border: 0;
      border-radius: 6px;
      padding: 8px 11px;
      background: var(--accent-color);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    input[type="checkbox"] {
      accent-color: var(--accent-color);
    }

    input[type="range"] {
      accent-color: var(--accent-color);
    }

    .language {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--label-color);
      font-size: 14px;
      white-space: nowrap;
    }

    .language select {
      min-width: 128px;
      border: 0;
      padding: 2px 4px;
      background: transparent;
      color: var(--font-color);
      font-weight: 600;
      color-scheme: light;
    }

    .inline {
      display: grid;
      gap: 12px;
    }

    .zoomRow {
      display: grid;
      grid-template-columns: 38px 1fr 38px;
      align-items: center;
      gap: 10px;
    }

    .zoomBtn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--font-color);
      font: inherit;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    .zoomBtn:hover {
      border-color: var(--accent-color);
      color: var(--accent-hover-color);
    }

    .fieldTitle {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .advanced {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid rgba(110, 154, 130, 0.24);
      border-radius: 10px;
      background: var(--accent-color-10);
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 12px;
      color: var(--font-color);
      font-weight: 650;
    }

    .option input { width: 18px; height: 18px; margin-top: 3px; }

    .hint, output {
      color: var(--label-color);
      font-size: 14px;
    }

    .download {
      display: inline-block;
      margin-top: 18px;
      width: 100%;
      text-align: center;
      text-decoration: none;
      font-weight: 850;
      background: var(--accent-color);
      color: white;
      border: 0;
    }

    .download:hover { background: var(--accent-hover-color); }

    .download[aria-disabled="true"] {
      pointer-events: none;
      opacity: 0.55;
      background: #87928d;
    }

    .previewPanel {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: min(760px, calc(100vh - 112px));
      overflow: hidden;
    }

    .previewHeader, .previewFooter {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .previewFooter {
      border-top: 1px solid var(--border-color);
      border-bottom: 0;
      color: var(--label-color);
      font-size: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 850;
      background: var(--badge-bg);
      color: var(--badge-text);
      white-space: nowrap;
    }

    .badge.transparent {
      background: rgba(49, 95, 157, 0.13);
      color: var(--blue);
    }

    .badge.solid {
      background: rgba(110, 154, 130, 0.16);
      color: var(--accent-hover-color);
    }

    .badge.bmp {
      background: rgba(183, 121, 31, 0.16);
      color: var(--warning);
    }

    .previewStage {
      display: grid;
      place-items: center;
      padding: 20px;
      overflow: auto;
      background: var(--bg);
    }

    .checker {
      background-color: #f5f7fa;
      background-image:
        linear-gradient(45deg, #a8b0ba 25%, transparent 25%),
        linear-gradient(-45deg, #a8b0ba 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #a8b0ba 75%),
        linear-gradient(-45deg, transparent 75%, #a8b0ba 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    }

    canvas {
      display: block;
      width: min(100%, 528px);
      height: auto;
      max-height: calc(100vh - 250px);
      object-fit: contain;
      background: transparent;
    }

    .hidden { display: none; }

    @media (max-width: 840px) {
      body { padding: 14px; }
      .site-header { flex-direction: column; }
      .language { align-self: flex-end; }
      .workspace { grid-template-columns: 1fr; }
      .previewPanel { min-height: auto; }
      .previewHeader, .previewFooter { align-items: flex-start; flex-direction: column; }
      canvas { max-height: 68vh; }
    }

    @media (max-width: 520px) {
      body { padding: 10px; }
      .panel, .previewPanel { border-radius: 8px; }
      .flow { display: none; }
      .previewStage { padding: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="site-header">
      <div>
        <p class="eyebrow" data-i18n="eyebrow"></p>
        <h1 data-i18n="title"></h1>

          <span class="arrow">→</span>

          <span data-i18n="flowPreview"></span>
          <span class="arrow">→</span>
          <span data-i18n="flowDownload"></span>
        </div>
      </div>
      <label class="language">
        <span data-i18n="language"></span>
        <select id="language">
          <option value="vi">Tiếng Việt</option>
          <option value="en">English</option>
          <option value="zh">简体中文</option>
        </select>
      </label>
    </header>

    <div class="workspace">
    <section class="panel">
      <label for="file" data-i18n="fileLabel"></label>
      <input id="file" type="file" accept="image/*">
      <p class="hint" data-i18n="fileHint"></p>

      <div class="inline">
        <div>
          <label for="device" data-i18n="deviceLabel"></label>
          <select id="device">
            <option value="x3" selected data-i18n="deviceX3"></option>
            <option value="x4" data-i18n="deviceX4"></option>
          </select>
        </div>
        <div>
          <label for="mode" data-i18n="modeLabel"></label>
          <select id="mode">
            <option value="transparent" selected data-i18n="modeTransparent"></option>
            <option value="normal" data-i18n="modeNormal"></option>
          </select>
        </div>
      </div>

      <label for="fit" data-i18n="fitLabel"></label>
      <select id="fit">
        <option value="fill" selected data-i18n="fitFill"></option>
        <option value="height" data-i18n="fitHeight"></option>
        <option value="width" data-i18n="fitWidth"></option>
      </select>
      <p class="hint" data-i18n="fitHint"></p>

      <label for="zoom" class="fieldTitle">
        <span data-i18n="zoomLabel"></span>
        <output id="zoomOut">100%</output>
      </label>
      <div class="zoomRow">
        <button id="zoomDown" class="zoomBtn" type="button" aria-label="">−</button>
        <input id="zoom" type="range" min="50" max="250" step="5" value="100">
        <button id="zoomUp" class="zoomBtn" type="button" aria-label="">+</button>
      </div>
      <p class="hint" data-i18n="zoomHint"></p>

      <section id="normalOptions" class="advanced hidden">
        <strong data-i18n="smoothTitle"></strong>
        <p class="hint" data-i18n="smoothHint"></p>
        <label class="option">
          <input id="dither" type="checkbox" checked>
          <span data-i18n="dither"></span>
        </label>
      </section>

      <a id="download" class="download" aria-disabled="true" download="sleep-overlay.png"></a>

      <p class="hint" id="status"></p>
      <p class="hint" data-i18n="copyHint"></p>
    </section>

    <section class="previewPanel">
      <div class="previewHeader">
        <div>
          <strong data-i18n="previewTitle"></strong>
          <p class="hint" id="previewHint"></p>
        </div>
        <span id="previewBadge" class="badge"></span>
      </div>
      <div class="previewStage">
        <div class="checker">
          <canvas id="canvas" width="528" height="792"></canvas>
        </div>
      </div>
      <div class="previewFooter">
        <span id="stats"></span>
        <span data-i18n="checkerHint"></span>
      </div>
    </section>
    </div>
  </main>

    let downloadUrl = null;
    let downloadGeneration = 0;
    let language = initialLanguage();

    function initialLanguage() {
      const saved = localStorage.getItem(LANGUAGE_KEY);
      if (saved && TEXT[saved]) return saved;
      return "en";
    }

    function t(key, values = {}) {
      let text = (TEXT[language] && TEXT[language][key]) || TEXT.en[key] || key;
      for (const [name, value] of Object.entries(values)) {
        text = text.replaceAll(`{${name}}`, value);
      }
      return text;
    }

    function applyLanguage() {
      document.documentElement.lang = language === "zh" ? "zh-Hans" : language;
      document.title = t("title");
      els.language.value = language;
      document.querySelectorAll("[data-i18n]").forEach(node => {
        node.textContent = t(node.dataset.i18n);
      });
      els.zoomDown.setAttribute("aria-label", t("zoomOut"));
      els.zoomDown.title = t("zoomOut");
      els.zoomUp.setAttribute("aria-label", t("zoomIn"));
      els.zoomUp.title = t("zoomIn");
      refreshStatus();
      render();
    }

    function formatSize(bytes) {
      if (!bytes) return "0 KB";
      if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function setStatus(text) {
      els.status.textContent = text || "";
    }

    function refreshStatus() {
      if (sourceError) {
        setStatus(t("statusError"));
      } else if (sourceInfo) {
        setStatus(t("statusLoaded", sourceInfo));
      } else {
        setStatus("");
      }
    }

    function revokeDownload() {
      if (downloadUrl) URL.revokeObjectURL(downloadUrl);
      downloadUrl = null;
      els.download.href = "";
      els.download.setAttribute("aria-disabled", "true");
    }

    function target() {
      return targets[els.device.value] || targets.x3;
    }

    function zoomPercent() {
      return Math.max(Number(els.zoom.min), Math.min(Number(els.zoom.max), Number(els.zoom.value) || 100));
    }

    function updateZoomControls() {
      const min = els.fit.value === "fill" ? 100 : 50;
      els.zoom.min = String(min);
      if (Number(els.zoom.value) < min) els.zoom.value = String(min);
      if (Number(els.zoom.value) > Number(els.zoom.max)) els.zoom.value = els.zoom.max;
      els.zoomOut.textContent = `${zoomPercent()}%`;
    }

    function placementScale(profile) {
      const widthScale = profile.width / sourceRect.width;
      const heightScale = profile.height / sourceRect.height;
      if (els.fit.value === "width") return widthScale;
      if (els.fit.value === "height") return heightScale;
      return Math.max(widthScale, heightScale);
    }

    function detectSourceRect(image) {
      return { x: 0, y: 0, width: image.naturalWidth, height: image.naturalHeight };
    }

    function transparencyStats(imageData) {
      const data = imageData.data;
      let transparent = 0;
      for (let i = 3; i < data.length; i += 4) {
        if (data[i] < 250) transparent++;
      }
      const total = data.length / 4;
      return { has: transparent > 0, percent: Math.round((transparent * 1000) / total) / 10 };
    }

    function ditherCanvasToBlackWhite(canvas) {
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
          const i = (y * canvas.width + x) * 4;
          const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
          const threshold = els.dither.checked ? (bayer[y & 3][x & 3] + 0.5) * 16 : 145;
          const v = gray < threshold ? 0 : 255;
          data[i] = data[i + 1] = data[i + 2] = v;
          data[i + 3] = 255;
        }
      }
      ctx.putImageData(imageData, 0, 0);
    }

    function crc32(bytes) {
      if (!crc32.table) {
        crc32.table = new Uint32Array(256);
        for (let n = 0; n < 256; n++) {
          let c = n;
          for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
          crc32.table[n] = c >>> 0;
        }
      }
      let c = 0xffffffff;
      for (const b of bytes) c = crc32.table[(c ^ b) & 0xff] ^ (c >>> 8);
      return (c ^ 0xffffffff) >>> 0;
    }

    function pngChunk(type, payload = new Uint8Array()) {
      const out = new Uint8Array(12 + payload.length);
      const view = new DataView(out.buffer);
      view.setUint32(0, payload.length, false);
      for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
      out.set(payload, 8);
      view.setUint32(8 + payload.length, crc32(out.subarray(4, 8 + payload.length)), false);
      return out;
    }

    async function deflateBytes(bytes) {
      if (typeof CompressionStream !== "function") return null;
      try {
        const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate"));
        return new Uint8Array(await new Response(stream).arrayBuffer());
      } catch {
        return null;
      }
    }

    function quantizeOverlay(imageData, grayLevels, alphaLevels) {
      const data = imageData.data;
      const palette = [];
      const alphas = [];
      const lookup = new Map();
      const indexes = new Uint8Array(imageData.width * imageData.height);
      let visibleWeight = 0;
      let visibleLumaError = 0;
      let activeAlphaError = 0;
      let activeAlphaCount = 0;

      function paletteIndex(key, gray, alpha) {
        let idx = lookup.get(key);
        if (idx !== undefined) return idx;
        idx = alphas.length;
        lookup.set(key, idx);
        palette.push(gray, gray, gray);
        alphas.push(alpha);
        return idx;
      }

      for (let i = 0, p = 0; i < data.length; i += 4, p++) {
        const alpha = data[i + 3];
        const luma = Math.round(data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
        let idx;
        let outLuma = 255;
        let outAlpha = 0;
        if (alpha < 4) {
          idx = paletteIndex("t", 255, 0);
        } else {
          const grayBucket = Math.round((luma * (grayLevels - 1)) / 255);
          const alphaBucket = Math.max(1, Math.round((alpha * (alphaLevels - 1)) / 255));
          outLuma = Math.round((grayBucket * 255) / (grayLevels - 1));
          outAlpha = Math.round((alphaBucket * 255) / (alphaLevels - 1));
          idx = paletteIndex(`${grayBucket},${alphaBucket}`, outLuma, outAlpha);
          activeAlphaError += Math.abs(alpha - outAlpha);
          activeAlphaCount++;
        }
        const weight = alpha / 255;
        visibleLumaError += Math.abs(luma - outLuma) * weight;
        visibleWeight += weight;
        indexes[p] = idx;
      }

      return {
        palette: new Uint8Array(palette),
        alphas: new Uint8Array(alphas),
        indexes,
        colorCount: alphas.length,
        visibleLumaError: visibleWeight ? visibleLumaError / visibleWeight : 0,
        activeAlphaError: activeAlphaCount ? activeAlphaError / activeAlphaCount : 0
      };
    }

    function overlayPaletteLooksGood(quantized) {
      return quantized.visibleLumaError <= 2 && quantized.activeAlphaError <= 2.5;
    }

    async function makeIndexedPngBlob(canvas, quantized) {
      const stride = canvas.width + 1;
      const scanlines = new Uint8Array(stride * canvas.height);
      for (let y = 0; y < canvas.height; y++) {
        const row = y * stride;
        scanlines[row] = 0;
        scanlines.set(quantized.indexes.subarray(y * canvas.width, (y + 1) * canvas.width), row + 1);
      }
      const compressed = await deflateBytes(scanlines);
      if (!compressed) return null;

      const ihdr = new Uint8Array(13);
      const view = new DataView(ihdr.buffer);
      view.setUint32(0, canvas.width, false);
      view.setUint32(4, canvas.height, false);
      ihdr[8] = 8;
      ihdr[9] = 3;
      const signature = new Uint8Array([137, 80, 78, 71, 13, 10, 26, 10]);
      return new Blob([
        signature,
        pngChunk("IHDR", ihdr),
        pngChunk("PLTE", quantized.palette),
        pngChunk("tRNS", quantized.alphas),
        pngChunk("IDAT", compressed),
        pngChunk("IEND")
      ], { type: "image/png" });
    }

    async function makeOptimizedOverlayPngBlob(canvas) {
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let firstQualityBlob = null;
      let fallbackBlob = null;
      for (const candidate of overlayPaletteCandidates) {
        const quantized = quantizeOverlay(imageData, candidate.gray, candidate.alpha);
        if (quantized.colorCount > 256) continue;
        const blob = await makeIndexedPngBlob(canvas, quantized);
        if (!blob) return null;
        fallbackBlob = blob;
        if (overlayPaletteLooksGood(quantized)) {
          if (!firstQualityBlob) firstQualityBlob = blob;
          if (blob.size <= overlayTargetPngBytes) return blob;
        }
      }
      return firstQualityBlob || fallbackBlob;
    }

    function drawSource() {
      const t = target();
      els.canvas.width = t.width;
      els.canvas.height = t.height;
      ctx.clearRect(0, 0, t.width, t.height);
      if (els.mode.value === "normal") {
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, t.width, t.height);
      }
      if (!sourceImage) return null;

      const scale = placementScale(t) * (zoomPercent() / 100);
      const drawWidth = Math.max(1, Math.round(sourceRect.width * scale));
      const drawHeight = Math.max(1, Math.round(sourceRect.height * scale));
      const x = Math.floor((t.width - drawWidth) / 2);
      const y = Math.floor((t.height - drawHeight) / 2);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(
        sourceImage,
        sourceRect.x,
        sourceRect.y,
        sourceRect.width,
        sourceRect.height,
        x,
        y,
        drawWidth,
        drawHeight
      );
      const drawnRect = { x, y, width: drawWidth, height: drawHeight };

      if (els.mode.value === "normal") ditherCanvasToBlackWhite(els.canvas);
      return drawnRect;
    }

    function makeBmpBlob(canvas) {
      const width = canvas.width;
      const height = canvas.height;
      const rowStride = Math.ceil(width / 32) * 4;
      const pixelBytes = rowStride * height;
      const fileSize = 14 + 40 + 8 + pixelBytes;
      const bytes = new Uint8Array(fileSize);
      const view = new DataView(bytes.buffer);
      bytes[0] = 0x42; bytes[1] = 0x4d;
      view.setUint32(2, fileSize, true);
      view.setUint32(10, 14 + 40 + 8, true);
      view.setUint32(14, 40, true);
      view.setInt32(18, width, true);
      view.setInt32(22, height, true);
      view.setUint16(26, 1, true);
      view.setUint16(28, 1, true);
      view.setUint32(34, pixelBytes, true);
      view.setUint32(46, 2, true);
      view.setUint32(50, 2, true);
      bytes.set([0, 0, 0, 0, 255, 255, 255, 0], 54);

      const imageData = ctx.getImageData(0, 0, width, height).data;
      const offset = 14 + 40 + 8;
      for (let y = 0; y < height; y++) {
        const srcY = height - 1 - y;
        const row = offset + y * rowStride;
        for (let x = 0; x < width; x++) {
          const i = (srcY * width + x) * 4;
          const gray = imageData[i] * 0.299 + imageData[i + 1] * 0.587 + imageData[i + 2] * 0.114;
          if (gray >= 128) bytes[row + (x >> 3)] |= 0x80 >> (x & 7);
        }
      }
      return new Blob([bytes], { type: "image/bmp" });
    }

    function updatePreviewState() {
      const profile = target();
      const modeText = els.mode.value === "transparent" ? t("statsTransparent") : t("statsNormal");
      els.stats.textContent = t("stats", {
        device: els.device.value.toUpperCase(),
        width: profile.width,
        height: profile.height,
        mode: modeText
      });

      els.previewBadge.className = "badge";
      if (!sourceImage) {
        els.previewHint.textContent = t("previewEmpty");
        els.previewBadge.textContent = t("badgeEmpty");
        return;
      }
      if (els.mode.value === "normal") {
        els.previewHint.textContent = t("previewNormal");
        els.previewBadge.classList.add("bmp");
        els.previewBadge.textContent = t("badgeBmp");
        return;
      }

      const stats = transparencyStats(ctx.getImageData(0, 0, els.canvas.width, els.canvas.height));
      els.previewHint.textContent = t("previewTransparent");
      if (stats.has) {
        els.previewBadge.classList.add("transparent");
        els.previewBadge.textContent = t("badgeTransparent", { percent: stats.percent });
      } else {
        els.previewBadge.classList.add("solid");
        els.previewBadge.textContent = t("badgeSolid");
      }
    }

    function updateDownload() {
      revokeDownload();
      const generation = ++downloadGeneration;
      if (!sourceImage) {
        els.download.textContent = t("downloadIdle");
        return;
      }
      const name = els.mode.value === "transparent" ? "sleep-overlay.png" : "sleep.bmp";
      els.download.textContent = t("downloadWorking");
      const finish = (blob) => {
        if (generation !== downloadGeneration || !blob) return;
        downloadUrl = URL.createObjectURL(blob);
        els.download.href = downloadUrl;
        els.download.download = name;
        els.download.removeAttribute("aria-disabled");
        els.download.textContent = t("downloadReady", { name, size: formatSize(blob.size) });
      };
      if (els.mode.value === "transparent") {
        makeOptimizedOverlayPngBlob(els.canvas).then(blob => {
          if (blob) {
            finish(blob);
          } else {
            els.canvas.toBlob(finish, "image/png");
          }
        });
      } else {
        finish(makeBmpBlob(els.canvas));
      }
    }

    function render() {
      els.normalOptions.classList.toggle("hidden", els.mode.value !== "normal");
      updateZoomControls();
      drawSource();
      updatePreviewState();
      updateDownload();
    }

    els.language.addEventListener("change", () => {
      language = els.language.value;
      localStorage.setItem(LANGUAGE_KEY, language);
      applyLanguage();
    });

    els.file.addEventListener("change", () => {
      const file = els.file.files && els.file.files[0];
      revokeDownload();
      sourceImage = null;
      sourceRect = null;
      sourceInfo = null;
      sourceError = false;
      if (!file) {
        render();
        refreshStatus();
        return;
      }
      const img = new Image();
      img.onload = () => {
        sourceImage = img;
        sourceRect = detectSourceRect(img);
        sourceInfo = {
          width: img.naturalWidth,
          height: img.naturalHeight,
          size: formatSize(file.size)
        };
        sourceError = false;
        refreshStatus();
        render();
        URL.revokeObjectURL(img.src);
      };
      img.onerror = () => {
        sourceInfo = null;
        sourceError = true;
        refreshStatus();
        render();
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(file);
    });

    function stepZoom(delta) {
      const next = Math.max(Number(els.zoom.min), Math.min(Number(els.zoom.max), zoomPercent() + delta));
      els.zoom.value = String(next);
      render();
    }

    els.zoomDown.addEventListener("click", () => stepZoom(-5));
    els.zoomUp.addEventListener("click", () => stepZoom(5));

    for (const el of [els.device, els.mode, els.fit, els.zoom, els.dither]) {
      el.addEventListener("input", render);
      el.addEventListener("change", render);
    }
    applyLanguage();
  </script>
</body>
</html>
